[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-private"
version = "0.1.0"
description = "Multi-agent MCP framework for Cursor IDE"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastembed>=0.8.1",
    "huggingface-hub>=0.23",
    "numpy>=1.24",
    "langfuse>=3.0",
    "python-dotenv",
    "PyYAML>=6.0",
    "cachetools>=5.3",
    "cryptography==50.0.2",
    "mcp==1.28.1",
    "uvicorn==0.48.0",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
    "anthropic>=0.18.0",
    "langdetect>=1.0",
]

[project.optional-dependencies]
thread-status = [
    "claude-agent-sdk==0.2.168",
]
signing-tests = [
    "pytest>=8.0",
    "model-signing==1.1.1",
]
local-inference = [
    "httpx>=0.28.1,<0.29",
]
local-inference-redis = [
    "httpx>=0.28.1,<0.29",
    "redis>=7.0.0,<7.1",
]
evals = [
    "datasets>=3.0",
    "pytest>=8.0",
    "jinja2>=3.1.6",
    "openai>=1.40",
    "anthropic>=0.40",
]

[tool.uv]
# fastembed (0.8.1 and 0.9.0) caps pillow<13.0, but Pillow 13.0.0 is the first
# release that fixes CVE-2026-112393, CVE-2026-112403, CVE-2026-112900 and other
# HIGH image-decoding issues. The override applies to uv.lock only; pip installs
# from requirements.txt still follow fastembed's cap.
override-dependencies = ["pillow>=13.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evals*", "scripts._helpers*"]

[tool.setuptools.package-data]
"src.context_compaction" = ["cursor_ui.js"]

[tool.pytest.ini_options]
addopts = ["-m", "not slow"]
markers = [
    "slow: integration tests that load embedding model / vector store (opt-in: run with `pytest -m slow`)",
]
