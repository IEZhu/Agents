# Review guidance for the rust stack, grounded in bot findings on this
# owner's repositories. See docs/review-config.md and the templates README.
- path: "**/*.rs"
  instructions: |-
    Inspect every platform cfg guard this change adds, narrows or widens around a platform specific call. Report a defect when the guard covers one call site while sibling calls of the same capability stay unguarded, for example a builder option such as skip_taskbar(true), visible(false) or position(..) gated off for Linux while the matching runtime setters set_skip_taskbar, set_position or center still run there. Report a defect when the guard makes code reachable on a platform that could never reach it before, because the panic or the blank surface behind that path appears there for the first time. Report a defect when the cfg on a call site is wider than the cfg on the import or helper it uses, since that fails to compile on a third target. Inspect runtime session detection separately. Deciding the display server from environment variables with backend.contains("x11") is a defect, because GDK_BACKEND holds a comma separated priority list such as wayland,x11, so the check must read the selected first entry and fall back to WAYLAND_DISPLAY or XDG_SESSION_TYPE. Calling such a detector twice inside one function is a defect too, since the two reads can disagree. Fix direction: drive every guarded call from one shared predicate, store the detection result in a local, and say in the guard whether it targets the operating system or the session type.
- path: "src-tauri/src/window*.rs"
  instructions: |-
    Inspect the order in which a window becomes visible relative to its geometry and to its webview. Report a defect when show() runs inside a shared builder helper or before set_size, set_min_size, set_position and center() have been applied, because the window appears at the default size and at a compositor chosen origin and then visibly jumps. Report a defect when a platform skips the builder option visible(false) and the code does not call hide() right after build(), and when a capture window such as a screenshot surface is visible while it captures the screen, since it records itself as a blank frame. Report a defect when Rust calls show() before an emit whose frontend handler decides to hide the window, because the user sees a flash. Inspect the reuse path of an existing window. Returning an existing handle early must not skip reapplying the configured size and position, and the helper must not call show() or set_focus() on a reused handle when every call site shows the window after its own configuration. Inspect coordinate conversions. Multiplying a value that is already in physical pixels, such as a mouse position, by the scale factor is a defect, and so is falling back to a hard coded scale factor of 1.0 when current_monitor() yields Err or Ok(None) while scale_factor() is available. Fix direction: build hidden, configure, then show from the call site, keep one documented unit per coordinate, and leave visibility to the frontend where it already owns that decision.
- path: "src-tauri/src/**/*.rs"
  instructions: |-
    Inspect every unwrap and expect this change leaves on a call that the window manager, compositor or display server can legitimately reject. That includes window operations such as set_position, set_size, set_always_on_top, set_skip_taskbar, set_decorations, show and hide, monitor queries such as available_monitors, current_monitor and primary_monitor, WebviewWindowBuilder::build, emit to a window that may already be closing, Path::to_str on a path that is not guaranteed to be UTF-8, and process spawns such as osascript. Each is a defect in a command, an event handler or setup, because the Err becomes a process wide panic that takes the whole desktop app down while the same call is handled with a logged Err elsewhere in the file. Monitor queries return Result<Option<..>>, so handling Err and then unwrapping the Option is still a defect. Report a defect when managed state is read with app.state::<T>() on a path that can run before its initializer, such as a close request or a synchronize handler, and require try_state with an error return. Report a defect when a function logs that it will recover from an Err and then calls expect on that same value, since the log promises a fallback that does not exist. Fix direction: match the Result, log the failing call by name, and keep the user visible action working with a safe default.
- path: "src-tauri/src/main.rs"
  instructions: |-
    Inspect every emit and every webview lifecycle hook this change touches. Report a defect when a generation or epoch counter that guards renderer reports is reset on a page load event that does not mean the navigation committed. On Windows, wry maps PageLoadEvent::Started to the WebView2 ContentLoading event, so a failed or superseded navigation resets the counter while the previous document still owns the resource and keeps its old generation, after which every later report fails the check. Report a defect when native code clears or rejects a queued operation without emitting the matching cancellation epoch or tick, because a renderer overlay that waits for native completion stays on screen. Report a defect when a periodic snapshot emit ships retained history, such as every stored activity span, on each tick of a 250 ms or 500 ms loop and to every webview including windows that never read it. Report a defect when a tray or window handle is fetched by an identifier, for example tray_by_id("main"), that the builder never assigns, because the lookup returns None and the update silently does nothing. Fix direction: tie the reset to a commit equivalent signal for each platform, emit the cancellation signal from every path that clears a token, send a cursor or a capped tail to the window that consumes it, and set the identifier explicitly where the handle is built.
- path: "src-tauri/**/*.rs"
  instructions: |-
    Inspect every long lived thread, hook, listener and spawned loop. A thread that owns Windows low level input hooks such as WH_KEYBOARD_LL or WH_MOUSE_LL must wait on its own message queue, for example with MsgWaitForMultipleObjects and QS_ALLINPUT plus a timeout. Sleeping between pumps with std::thread::sleep is a defect, because Windows delivers hook callbacks through that queue and withholds every key press and pointer move until the procedure returns, and a missed LowLevelHooksTimeout lets Windows uninstall the hook while the reported status still says active. Report a defect when an accept or read loop treats every error except WouldBlock as fatal and exits, since ConnectionAborted, Interrupted and descriptor exhaustion are transient and no caller restarts the worker until the user toggles the feature. Report a defect when a background monitor is started both in setup and in a toggle handler, which spawns a second infinite loop, and when the loop returns as soon as its enable flag goes false while the only restart path assumes it still runs. Report a defect when an event loop refactor drops the call that installed a hook, leaving the feature dead. Report a defect when two native queries share one deadline that is measured once, because the first query can consume the budget and the second then fails silently. Inspect lock scope in the same pass. Holding a MutexGuard across a blocking platform call, a multi second confirmation loop or a full snapshot parse is a defect when a renderer timer polls that same mutex every few hundred milliseconds. Fix direction: validate under the lock, drop the guard before the platform call, share large payloads through an Arc, and give every loop one owner with an idempotent start.
- path: "src-tauri/src/*.rs"
  instructions: |-
    Inspect how this change resolves files that ship with the bundle and files it writes at runtime. Building a path to a bundled asset, for example an AppleScript that osascript runs, from app_config_dir() plus a resources segment is a defect, because that directory belongs to the user profile, nothing copies the asset there, and the call fails on an installed build. Require path().resource_dir() or path().resolve(.., BaseDirectory::Resource) and confirm the file is listed in the bundle resources. Report a defect when the code writes a file such as a JSON handoff into an application directory without create_dir_all first, since that directory is absent on a fresh profile and the window then renders empty content. Report a defect when a WebView data store or profile identifier is derived from DefaultHasher or any other hash whose algorithm the standard library does not guarantee across releases, because a toolchain upgrade points a persistent install at an empty store and loses renderer held data, and report it again when two windows derive that identifier through duplicated code that can drift apart. Report a defect when a store is created with StoreBuilder::build() and never loaded or reloaded while the log claims the config was loaded, because the app then starts from defaults. Fix direction: use a fixed identifier for a persistent profile, keep a path hash only for throwaway directories, and expose one helper that every window calls.
