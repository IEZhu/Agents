# Review guidance for the docs-ai-instructions stack, grounded in bot findings on this
# owner's repositories. See docs/review-config.md and the templates README.
- path: "{agents,skills,rules,implants}/**/*.mdc"
  instructions: |-
    Read the YAML frontmatter and the file body as two renderings of one contract. Standard prompt tiers render only the frontmatter compiled value while deeper tiers render the body, so a statement that exists in one and not the other silently fails to reach the model. Report a defect when compiled names fewer tiers, levels, steps or categories than the body section it summarizes, when compiled orders them differently, when compiled still describes a mechanism the body replaced, or when description and keywords advertise a capability the body no longer contains. Quote the exact compiled text that should replace it. Report a defect when an identity field such as display_name or role changes while the body paragraph still introduces the file under the previous name or previous scope, and require both surfaces to change together. Inspect every reference this file makes to another persona, skill, rule or implant by file name. Report a defect when the referenced file no longer holds the referenced content because that content moved, was renamed or was deleted, and when content removed from this file is not reachable from any other file although a capability directive or another prompt still demands it. Require the reference to be repointed to the file that now holds the content, or the content to be restored, and require the change to say where a removed capability now lives.
- path: "{agents,skills}/**/*.mdc"
  instructions: |-
    Inspect every routing keyword list in the frontmatter as matcher input, not as prose. Report a defect when a keyword string contains an unbalanced parenthesis, bracket or quote, because the file then fails to parse or the keyword never matches. Report a defect when a keyword spells an abbreviation in a case the body does not use, so the two spellings cannot be correlated. Report a defect when a keyword is a bare common word such as patient, update, select, join, visa or feel, or a phrase whose only significant token is such a word, because substring and token fallback matching then routes unrelated queries to this file. Require a qualified phrase that carries the domain or jurisdiction, and require sibling files to use the same qualification style. Report a defect when a keyword belongs to another jurisdiction, product or domain than this file, and when a keyword contains stray characters from an unrelated script. Report a defect when a change removes the last keyword that covered a topic this file still claims in its role or body, or that no sibling file covers, because the topic then has no route at all. Name the keyword, the queries it wrongly matches or no longer matches, and the replacement.
- path: "agents/*/system_prompt.mdc"
  instructions: |-
    Check the frontmatter against the agent schema and the loader, and check the body against what the loader can actually supply. Report a defect when a required frontmatter section is absent, for example the context section with its file globs or the static skill list used when the server is unavailable, and when a tier list breaks its documented size range, for example an empty preferred skill list where three to eight entries are required. Report a defect when the body relies on a skill for deterministic behaviour such as an output format or a safety check while that skill sits in a tier that retrieval may skip, and require core wiring for behaviour the body states unconditionally. Report a defect when the body tells the agent to load more files than the named tier can load on the standard tier, and require the count to match the loader or the instruction to be narrowed. Inspect every table that partitions a range or a population. Report a defect when two rows overlap on a boundary value while they prescribe different behaviour, because selection is then ambiguous for that value. Report a defect when the prompt uses more than one vocabulary for the same labels, for example tier names in a table that the output contract does not list, or a superseded term left in a template header. Require one canonical label set, spelled identically in the table, the body and the output contract.
- path: "flows/**/*.md"
  instructions: |-
    Read a flow as an executable procedure and check that every step can be performed with what earlier steps produced. Report a defect when a later step consumes a result that no earlier step creates, for example an aggregation that needs verdicts for a variant whose run is never started, and when a step passes an argument that exists only on a conditional path, so the command names a missing file when that path was not taken. Report a defect when a documented command cannot run in the stated client, for example a shell style glob given to a client that runs commands without a shell, and require explicit enumerated paths. Report a defect when a step releases a lock, pointer or ownership marker before the final state and label writes happen, because another session can take ownership and the late writes then overwrite its state. Require ownership to be held through the last write and an ownership check before writing. Report a defect when a control that affects production also runs in a rehearsal or dry mode, and require the step to be conditioned on the mode. Report a defect when a mode the flow advertises, such as a no write draft, is contradicted by a step that persists or logs data, and when an unconditional final requirement cannot be satisfied by an exit the flow itself permits. Report a defect when a documented check claims to mirror a code contract but checks a narrower condition, for example a net tree diff instead of every commit, or a policy read from a moving branch instead of the pinned revision. Require the stricter condition and a defined stop.
- path: "{docs,flows}/**/*.md"
  instructions: |-
    Inspect every documented step that writes, logs, prints or transmits content, and every value the document itself carries. Report a defect when a documented output includes user prompt text, a verbatim user request or another conversation payload, and when one requirement promises that a sink carries no secrets while another requires content to pass through unchanged, because both cannot hold. Require a named sanitized value for the field, a defined redaction point or an explicit opt out, and say which requirement must be narrowed. Report a defect when the document commits real identifiers that belong under access control, such as captured hardware addresses or an origin hostname and address that a proxy is meant to hide, and require pseudonyms or a move to an access controlled record. Report a defect when a step falls back to a weaker store or transport than the document promises, for example a private file where the stated requirement is an operating system secret store only, or an unencrypted remote for a credentialed push, and require fail closed behaviour or an explicit documented exception with its trade off. Report a defect when a missing attribution, marker or field is treated as authorization, and require the check to refuse when that evidence is absent. Report a defect when a permission claim holds on one platform only, for example numeric file modes on a system that uses access control lists, and require the platform specific control.
- path: "docs/**/*.md"
  instructions: |-
    Treat a design, plan or research document as a set of claims about the repository and about cited sources, and check the claims you can reach. Report a defect when a version, threshold, symbol, path or option named here differs from the pinned value in the manifest, lock file or code that governs it, and name the governing file and the correct value. Report a defect when the same measurement appears twice with different values and no stated reason, and when a precise result such as a detection count is given without the experiment, hardware, data set and denominator that produced it. Require the source to be linked or the number to be removed. Report a defect when the document asserts interoperability with an external schema, specification or software development kit while the described field, exclusion or symbol is not permitted or not documented there, and require the claim to be narrowed to the validated case. Report a defect when a review, plan or status document presents as open a decision the current plan already settles, or cites a table or section the current plan does not contain, and require a rebase against the current text. Report a defect when a date, rate or quantity is written in a form the document audience reads differently, such as an ambiguous all numeric date, and require an unambiguous spelling. Report a defect when an artifact the document says is needed to audit a run cannot be rebuilt from the inputs it names, and require that artifact to be archived or the exact revision to be recorded.
- path: "**/README.md"
  instructions: |-
    Check a README against the mechanism it documents and against the files it points to. Report a defect when the README still describes a removed registry, file or loading model, or states a size or count range the current model contradicts, for example a minimum of one where zero is allowed, and require the text to describe only the current mechanism. Report a defect when the same concept is defined twice in the file with different meanings, such as one line saying a field feeds retrieval and another saying it does not. Report a defect when a link or navigation entry points to a deleted or renamed file, or labels a target with the wrong language or content after a rename, and name the correct target. Report a defect when a documented command or runbook step omits a prerequisite whose absence makes the result wrong instead of failing loudly. Examples are checking out a branch without fast forwarding it, so a sweep evaluates stale content while reporting the branch name, dropping or restoring a database while another enabled service still writes to it, continuing a migration after a dump or archive step failed without checking that result, and leaving timers or services stopped because the restart sits in a cleanup block scheduled days later. Require the prerequisite, the failure check or the reordering. Require a named owner and date for any recorded expiry or rotation the document leaves unassigned.
- path: "{AGENTS.md,CLAUDE.md,scripts/templates/*.md}"
  instructions: |-
    Treat the contributor instruction file as the contract every client follows and review it as a specification. Report a defect when two passages state different requirements for the same situation, when an absolute requirement has no exception branch although another passage grants that exception, and when an instruction replaces or refreshes part of the loaded state while another part it depends on becomes stale. Report a defect when a branch tells the reader to perform the required steps directly without naming them or without a completion criterion, for example a fallback that says to run the checks when a tool is unavailable, so the reader cannot know when the gate is passed. Require the enumerated steps and the blocking condition. Report a defect when a required value cannot be produced on the path the document describes, because the reader then invents one. Report a defect when this file and another surface that delivers the same rule disagree, including an installation template, a client specific instruction file, a generated runtime instruction or a reference document. Name every surface that must carry the change and require them to agree, including footer labels, component lists and any condition that gates display or logging on an active setting. Require the delivery of each rule to be covered by a check.
