# Review guidance for the php stack, grounded in bot findings on this
# owner's repositories. See docs/review-config.md and the templates README.
- path: "**/*.php"
  instructions: "Check every WordPress write for its documented failure value before the script treats the change as done. wp_update_post and wp_insert_post return 0 on failure while $wp_error stays false, add_post_meta returns false when the unique insert fails or the key already holds a conflicting value, update_option returns false and does not guarantee that the stored value changed, and wp_delete_post returns false or null. It is a defect when such a result is unused, when only WP_Error is tested, when a change counter or a success message is produced from an unchecked call, or when the script still exits 0 after a failed write. It is also a defect to delete, overwrite or trust a backup option or post meta on the strength of a write that was never confirmed: read the backup and the restored value back with get_option or get_post_meta, compare them with the intended value, and keep the recovery copy plus a non zero exit status when the comparison fails. Report the exact line, the API call, the value WordPress returns on failure, and the state the site is left in."
- path: "tools/phases/**/*.php"
  instructions: "Inspect PHP level behaviour that quietly changes a migration result. Flag a closure or function declared with the string return type that returns preg_replace or preg_replace_callback directly, because PCRE returns null on a backtrack limit or on invalid UTF-8 under the u modifier, so the existing null guard becomes unreachable and the run aborts with a TypeError in the middle of an apply, leaving earlier pages written and no summary printed; declare the nullable string return type and keep the guard. Flag an array union where the left operand is current data and the right operand is a backup, for example pll_get_post_translations of the post plus the saved group, because the union keeps the left value for a duplicated key, so a restore silently keeps the newer entry; take the backup value explicitly for the keys it owns. Flag reads of a decoded JSON array by sequential index when the file can carry non sequential or string keys: normalize with array_values right after the count check, so neither array_combine nor an index based read can pair a translated string with the wrong source line. Flag use of the STDERR constant in a script whose documented invocation pipes it into php from stdin, where PHP does not define STDERR and the diagnostic path throws instead of printing its message and exit code; write to php://stderr instead."
- path: "tools/phases/phase*.php"
  instructions: "Review the argument parsing and the WordPress bootstrap at the top of each phase script. It is a defect when two mutually exclusive modes such as dry run and apply can be passed together and the script silently prefers the writing one, when the header documents a mode such as rollback, restore or import that the mode check does not accept, or when an option is accepted while present and empty, for example an empty lang value that passes the presence test and then disables the language filter so every language is processed instead of one. Require exactly one mode, implement every documented mode, and validate an option value against the known set of languages or post types. It is also a defect to load wp-load.php without the environment the documented command supplies: with DOMAIN missing, wp-config falls back to localhost and Yoast rebuilds the canonical and og:url of every saved object on that host, so require the variable and abort before the first write. A script that writes post_content must call wp_set_current_user with an administrator before that write, because kses filters content for a user without unfiltered_html and strips script, iframe, style and data attributes that machine translated pages contain, after which the stored content hash records the stripped text as a clean result. Re-read the Polylang language list after setting the user, since pll_languages_list cached for user 0 can omit an inactive language and make the script exit without processing anything."
- path: "tools/phases/phase1*.php"
  instructions: "Compare the rollback and cleanup branch with everything the apply branch changed. It is a defect when the backup stores only the previous value, because the restore then writes it over edits made after apply by an editor or by a later phase script: store the value that apply wrote next to the old one and restore only while the current value still equals it, otherwise skip that field and report it. It is a defect when apply left a field untouched because it already held the target value and rollback still clears it: record which items apply actually changed and act only on those. It is a defect when a partial restore deletes the whole backup: remove a backup entry only after its own item is restored, and retain the entries that were skipped. It is a defect when rollback restores less than apply removed, for example the content and the translation group but not the featured image IDs, and when a write lands after the guard already decided it failed, since the stranded backup then leaves the object in a state the retry guard rejects; return a distinct status for that post write failure. Check that a recovery or pending cleanup path removes everything the apply path created, including attachments whose IDs were recorded only after media_handle_sideload returned, because wp_delete_post does not delete child attachments, and that hash meta is rewritten when a draft is re-queued so the next run does not report a false upstream change."
- path: "tools/phases/phase1?-*.php"
  instructions: "Inspect how the script selects the posts, pages and menu items it will change. It is a defect when a WP_Query or get_posts selection relies on the default status and so misses future, pending or private objects that the task covers: a retirement step that omits future leaves a scheduled page and its menu items in place and WordPress publishes that page after the cleanup has run, so name the applicable statuses explicitly. It is a defect when a queue or retranslate selection tests only a translation state and ignores post_status, because saving an unpublished translation with post_status publish reverses an editor decision; exclude objects an editor has unpublished. It is a defect to resolve a translation by slug, since the translator keeps the existing post_name of an older translation, so a localized or suffixed slug makes the lookup fail and the step exits before touching the language specific fields; resolve non source language objects through pll_get_post_translations. When a step trashes translations and the pipeline can create new ones before rollback runs, check that rollback relinks the restored objects into the translation group and disposes of the replacements, instead of leaving published unlinked duplicates and a restored post pointing at the wrong translations."
- path: "tools/phases/phase7-translator/**/*.php"
  instructions: "Review the translator state machine and its admin controls against the backup promise in the file header. It is a defect to decide whether to back up an existing translation from a state label such as adopt or queued, because a force flag moves a hand written page to queued and the backup is then skipped, so wp_update_post overwrites the human text, the Yoast title and description and the template, none of which survive in revisions. Take the backup whenever the existing translation carries no AVS_TR_META_RESULT_HASH, and treat such a page as human so the control asks for confirmation first. It is a defect to call wp_update_post after a failed backup write: return an error instead. It is a defect to render a retranslate control for a language the request handler rejects, for example a page button built from a fixed language constant while the handler accepts only the languages in avs_tr_targets, so the request ends in HTTP 400 without setting the force flag; build controls from the same source the handler validates against. In the automatic checks, flag a validation rule that assumes one locale format, such as a digit run matcher that accepts only a space, NBSP or NNBSP as the thousands separator and therefore reports a correct English value like 1,234.5 as a number mismatch, because each failed pass consumes a retry attempt and leaves the page unpublished in the error state. Accept a comma or a period as a thousands separator when exactly three digits follow it."
- path: "tools/phases/phase12-*.php"
  instructions: "Check how the script locates the ACF or SCF row it rewrites and what it writes into each field. It is a defect to identify a repeater row by a substring of its text, for example the name of a person, because any other row that mentions the same name is then rewritten with the configured text while the intended row is skipped and never inserted; restrict the match to the expected layout and field key, and confirm the row identity before the update. It is a defect to write a human readable placeholder into a typed field, for example a note that a photo will be uploaded later into an image field, after the attachment helper returned zero, because the next run finds the text it expects and never repairs the field; require a valid attachment ID before inserting the block and report the language that failed instead. It is a defect to rewrite a translated field without checking the language and post type of the target, for example when an import path skips the selector that enforces post type and the source language, since a mis-targeted export then passes the hash check and overwrites an object in another language. It is a defect for an apply or import path to write posts and pages that the scheduled translator also writes without taking the shared run lock file, because the two runs can then overwrite or duplicate the same translation; hold the lock for the whole apply operation or refuse to run while the timer holds it."
