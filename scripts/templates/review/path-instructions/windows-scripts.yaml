# Review guidance for the windows-scripts stack, grounded in bot findings on this
# owner's repositories. See docs/review-config.md and the templates README.
- path: '**/*.bat'
  instructions: 'Inspect every cmd command that embeds a quoted path or generates code. FOR /F runs its command through cmd /c, which strips the outer quote pair when the command string starts with a quote, so a command that begins with a quoted interpreter path loses that quote and the executable token absorbs the following arguments. That is a defect whenever the command string starts with a quote and is not wrapped in one additional outer quote pair, so add that extra pair around the whole command. Flag any interpreter or script path used unquoted inside for /f when the path can contain spaces, because cmd then treats the first space delimited token as the executable and the captured variable stays empty. Quote the path. Flag python -c or similar inline snippets that escape an inner double quote with a backslash, because cmd does not treat a backslash as an escape inside a quoted argument and the snippet reaches the interpreter malformed. Use single quotes inside the snippet instead. When the script emits a temporary script or a code line with echo, check that every opening parenthesis in the emitted text is closed in the emitted text and that escaped characters such as caret, percent, greater than and pipe survive the echo, because an unbalanced parenthesis only fails at run time. Count the parentheses in the generated line and fix the escaping.'
- path: '**/*.bat'
  instructions: 'Inspect every invocation of python, pip or another interpreter in a cmd script. Using the bare command name after activate.bat is a defect when the script has already resolved an absolute interpreter path, because activation output is usually suppressed and unchecked, the selected launcher may be py -3.11 so that no python command exists on PATH, and the bare name then resolves to a system interpreter or to nothing. Helper scripts and generated snippets that import project only packages then fail, and pip installs land in the global environment. Require the resolved absolute path, for example the Scripts python.exe of the virtual environment or the previously selected launcher variable, for every pip call, every helper script, every inline -c snippet used for counting or configuration, and every temporary script the installer writes. Also check each for /f that captures a version or another value from such a probe: for /f does not clear the target variable when the command prints nothing, so an unsupported interpreter that exits non zero leaves the variable empty or stale and the later comparison reports the wrong version. Test errorlevel after the probe and branch on it.'
- path: '**/*.bat'
  instructions: 'Inspect every findstr test and every for /f that reads a value out of a dotenv or config file. findstr treats its pattern as a regular expression unless /L is given, so a placeholder pattern containing dots matches any real value with the same prefix and the check keeps firing after the value is configured. Add /L for a literal comparison. A findstr /B /L test for the plain key equals form is a defect when the file may also hold the export form, a quoted value, leading whitespace or no such line at all, because the script then decides the key is absent and overwrites a configured value, or decides it is present while the value is empty. Accept every assignment form the project tooling accepts, and treat a missing line and an empty value as unconfigured. When a value is captured with for /f, check that an inline comment, surrounding quotes and trailing whitespace are stripped before the value is compared or written back, because a placeholder line copied from the example file carries a trailing comment and the raw comparison classifies the key wrongly. Strip the comment and the quotes, or delegate the parsing to the same helper the rest of the project uses.'
- path: '**/*.bat'
  instructions: 'Inspect variable expansion and process scope in cmd scripts. Inside a setlocal DisableDelayedExpansion scope an exclamation mark reference is not expanded, so a guard that sets fatal context variables and then jumps to a shared handler which expands them loses its message and the script exits silently. End that scope before setting the variables, and route every guard through the shared handler instead of calling exit /b directly. The right hand side of a pipeline runs in a child cmd.exe, so a set executed there never reaches the parent and the later test still reads the old value. Run the command on its own line and set the variable from errorlevel afterwards. set /p leaves the variable unchanged when the user presses Enter, so a prompt whose variable is not initialized first can inherit a value from the parent environment and invert the documented default. Initialize the variable to that default before the prompt. A for /f body that chains two set commands with an ampersand and no parenthesized do block runs only the first one inside the loop, so the second variable is assigned after the loop from the wrong token. Wrap the body in parentheses. A yes or no test that compares only the single letter n accepts the answer no as agreement. Match any answer that starts with n or N.'
- path: '**/*.ps1'
  instructions: 'Inspect PowerShell helpers that pick an interpreter, a JDK or another tool from the file system or from several candidates. Returning the first directory produced by Get-ChildItem is a defect, because enumeration order is not guaranteed and the choice then varies between machines and runs. Sort the candidates explicitly. Sorting folder names as text is also a defect, because jdk-9 sorts above jdk-17 and the older runtime wins. Extract the numeric major version from the name, or ask the tool for its version, and order by that number. When runtime code requires a minimum version, check that the selector enforces that floor and fails with a clear message when no candidate meets it, instead of returning the newest version that happens to be installed. When the script later removes an installation tree, check that the interpreter it launches does not live inside that tree: Windows refuses to delete a running executable, so an installation that supplies the running interpreter leaves a partially removed directory and a failing exit code. Resolve the real executable path of each candidate, for Python through sys.executable, and reject any candidate inside the removal inventory before launching it.'
- path: '**/*.nsi'
  instructions: 'Inspect every environment variable and service registry write in an NSIS installer or uninstaller script. Writing a machine level or per service variable without first reading the previous value is a defect, because the variable may already be owned by another installation on that host. Store the previous value under the product registry key during install, restore it on uninstall, and delete the variable only when the installer created it from empty. A reg.exe add or a registry write that supplies a whole Environment REG_MULTI_SZ value replaces every entry in it, so other per service variables left by earlier versions, by policy or by an administrator disappear. Read the existing multi string, add or replace only the one entry, and write the result back. An uninstaller that expects sc delete to take the service key away with it is a defect, because the key survives when the service is only marked for deletion and stale per service environment entries stay on the machine. Delete the Environment value explicitly before removing the service. When the installer sets a variable that other processes are meant to read, check that the scope matches that expectation, because a per service Environment entry is invisible outside that service and no WM_SETTINGCHANGE broadcast makes it visible.'
