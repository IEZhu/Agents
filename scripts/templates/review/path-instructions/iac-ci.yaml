# Review guidance for the iac-ci stack, grounded in bot findings on this
# owner's repositories. See docs/review-config.md and the templates README.
# The authored entry for scripts/templates/** was dropped here: that path is
# Agents-Core's own template directory, and in another repository it means
# something unrelated. Its guidance about workflow templates installed into
# other repositories applies to .github/workflows/** above.
- path: '.github/workflows/**'
  instructions: 'Check that every workflow in this change still runs on the code it guards and that its failures are visible. Inspect on.pull_request.paths and on.push.paths against the files the jobs really execute, including every module imported by the selected tests and every script a step invokes. It is a defect when a module exercised by those tests appears in neither filter list, because a pull request limited to that module skips the workflow and the check reports nothing at all; name the missing path and require it in both the pull_request and the push list. Inspect step level if conditions for the same silent skip. A validation or smoke step that a sibling step guards with hashFiles needs the same guard, otherwise a rerun of an older tag that lacks the test file fails on a missing file instead of skipping. A validation step placed after a scanning or gating step inherits the default success condition, so a failing scan removes runtime validation from the run; require an explicit condition on the outcome of the earlier step rather than moving the validation ahead of the gate, because that would let the gate be skipped instead. When a workflow adds a schedule trigger, check how a failure on that schedule is detected: Actions sends email only to recipients who enabled those notifications, so a statement that a failed nightly run will email someone is not a detection path; require a configured alert or a conditional statement.'
- path: '.github/workflows/**'
  instructions: 'Inspect every run step that decides whether this workflow passes, and judge whether the step can exit zero while the work it gates actually failed. A step that infers success from the absence of a marker in an API response is a defect, because an authentication error, an empty body, an error code shaped differently than the pattern expects, a restart of the remote scheduler and a job that failed all remove that marker and produce a green run. Require the identifier returned by the trigger call to be carried forward and the terminal status read from a job details endpoint, with any non success status ending the step through exit 1. A pipeline such as scanner piped into tee and followed by a grep for High or Critical is a defect, because the default Actions shell runs bash -e without pipefail, so a scanner that fails without printing those words leaves the gate green; require pipefail or an explicit shell declaration. An exit code read after an assignment of the form RESPONSE=$(curl ...) is dead code, because the same errexit setting ends the step at the failing substitution and the diagnostic branch never runs; require an if form around the assignment or an explicit errexit window. Check that the HTTP status is captured and that an empty or non numeric value is rejected before any numeric comparison such as a test against 200, and that every curl call sets both a connect timeout and a maximum time, because a stalled socket otherwise holds the runner until the job timeout.'
- path: '.github/workflows/**'
  instructions: 'Inspect what each scanner in this workflow actually reads, and whether a real finding could still pass the gate. It is a defect when the scanned input omits a class of dependency that the built image or the build stage really contains. A filesystem scan of a node project without the flag that includes development dependencies skips packages the build stage installs, staging a Cargo manifest beside the Cargo lockfile makes Trivy drop Rust development dependencies in versions that have no such flag, and a package declared only as a version range in a requirements file but absent from the committed lockfile is ignored, so a vulnerable allowed version passes. Name the package or dependency class that escapes the scan and the flag or input change that restores it. Inspect secret scanning configuration: passing an empty value to the secret configuration flag only stops a repository configuration from loading, it does not disable the built in allow rules, so a credential committed to a Markdown file is still skipped; require a trusted configuration created outside the checkout that disables the relevant allow rule, and a synthetic credential that proves the job fails on it. Inspect how the step turns a report into a verdict. A check that asserts only that one operating system package and one language package appear cannot detect an inventory that silently lost packages, and an audit whose vulnerability data source failed can leave nothing for the final grep to match; require the report to be compared against the package database of the image and the installed distribution metadata, and require the step to fail when the inventory or the vulnerability data is incomplete, not only when a severity word appears.'
- path: '**/*.toml'
  instructions: 'Inspect dependency and packaging declarations here against the way the project is installed and tested in practice. It is a defect when a minimum version or an override takes effect on only one installation path, for example a resolver specific override that raises a floor while the documented pip install of a requirements file still resolves the vulnerable lower bound; require the floor on the path the documentation and the scripts really use, or a generated requirements file produced from the resolved set. It is a defect when a declared minimum still admits a version with a known advisory, so state the lowest safe version instead of the nearest minor release. When this change alters dependency metadata and the repository commits a lockfile, require the lockfile to be regenerated in the same change, because a locked install cannot reproduce the new requirement and a locked synchronisation rejects a lock whose project metadata still carries the old one. Inspect optional extras against the code that needs them: an extra that pulls a heavy package no module imports slows every install for nothing, and an extra that omits a provider client which the benchmark scripts and the tests expect breaks the documented install command, so name the package and the importing surface. Inspect packaging discovery and test configuration: a package discovery pattern finds no sub package that lacks an init module unless namespace packages are enabled, so a development tree keeps working through path insertion while an installed copy is incomplete, and a test marker only documents intent until the default options exclude it, so the default test run still executes the slow tests.'
- path: '**/docker-compose*.yml'
  instructions: 'Inspect how each service publishes ports and whether this file still parses when variable interpolation is disabled. It is a defect when a service publishes a port on every host interface while the documented topology places a reverse proxy in front of it: the mapping both collides with the proxy that owns that port and lets a client reach the service directly, which makes any trust the service places in a forwarded client address header unsafe, because the client can then set that header itself. Require the published port to be bound to the loopback address, moved to an internal port number and overridable through an environment variable, and state which header trust depends on that binding. It is a defect when a short form volume or port specification embeds a parameter default, because the extra colons make the configuration rendering command used by validation workflows split the specification on every colon and reject it with a too many colons error, which fails every job that renders this file, not only the service that carries the broken entry. Require the long form with source, target and read only as separate fields, so the specification parses with and without interpolation.'
- path: '**/*.nix'
  instructions: 'Inspect this Nix environment against the other build environments the repository already describes, such as the install commands in the readme, the continuous integration scripts and the container image. It is a defect when a package those environments install is absent from buildInputs or nativeBuildInputs while the build or the runtime still needs it. A bundler helper such as patchelf sets the run path on packaged binaries, so the packaging step fails late without it, and a library the application loads dynamically at runtime, for example a tray indicator library resolved through a dynamic loader, produces no build error and no log line, so the feature silently does not appear. Name the derivation attribute and the feature that breaks. Inspect every environment variable the shell exports. Extending a search path variable by writing the new entries followed by a plain reference to the old value is a defect, because an unset variable leaves an empty entry and the dynamic loader then searches the current working directory; require the conditional expansion that adds the separator only when the variable is set. When that form appears inside a Nix indented string, check the emitted shell code and not only the Nix source, because a doubled single quote before the dollar sign escapes to a literal quote and the expansion breaks.'
