# Review guidance for the go stack, grounded in bot findings on this
# owner's repositories. See docs/review-config.md and the templates README.
- path: "**/*.go"
  instructions: |-
    Inspect every database/sql call site in the change.
    Treat it as a defect when a column that can be NULL is scanned into a plain Go type. Nullable columns from a LEFT JOIN, a bare SUM or MAX over a result set that can be empty, and optional text columns all return NULL, and Scan then fails with a conversion error that breaks the whole page instead of rendering an empty state. Wrap the column in COALESCE or scan into sql.NullString, sql.NullInt64 or a pointer, and say explicitly what an absent value means. Do not substitute zero or the Unix epoch for a missing timestamp boundary that later enters arithmetic, because that silently shifts or widens a range.
    Treat it as a defect when a rows.Next loop ends without checking rows.Err, or when every query error is folded into an empty result. Use errors.Is against sql.ErrNoRows or pgx.ErrNoRows for the empty case only, and return lock, permission, schema and corruption errors to the caller instead of reporting no data with a successful status.
    Treat it as a defect when a Go slice is expanded into IN (?, ?, ...) without batching, because a long list exceeds the SQLite variable limit and fails at run time. Chunk the slice or join through a temporary table.
    Treat it as a defect when a path is concatenated into a file: SQLite URI without percent encoding, because a character such as # is read as URI syntax and opens a different database. Build the URI with url.URL, and open read only with mode=ro when the command must not apply schema or migrations.
    Treat it as a defect when a DELETE removes a row that another table still references and that reference has no foreign key, because later joins silently drop the dependent row. Add a NOT EXISTS guard for the dependent table.
- path: "**/web/*.go"
  instructions: |-
    Inspect every query that a page handler runs for a selected period.
    Treat a bucket predicate as a defect when it uses BETWEEN or any inclusive upper bound while the rest of the code uses the half open form bucket >= from AND bucket < to, because the page then counts one extra minute outside the period the user picked.
    Treat it as a defect when a value rendered for the selected period is read from a cumulative column on a parent row or from an all time aggregate. Badges, observation counts, group counts and first and last seen pairs are period claims, so compute them from rows inside the range, or project each interval onto the range before sorting and display.
    Treat it as a defect when the two sides of a time comparison use different units, for example a bucket column in Unix minutes compared with a last seen column in Unix seconds.
    Treat it as a defect when a window function such as ROW_NUMBER OVER PARTITION BY ranks the whole retention history although the handler renders one period, because the cost then grows with the database and the handler also runs on every autorefresh. Bound the window by the period. Apply a filter that can remove candidate rows only after the ranking, and use a LEFT JOIN where the joined column can be NULL, so the top row per key is chosen before exclusion.
    Treat it as a defect when the handler passes an identifier straight from a cookie or query string into a query while the view model it later builds for the template normalises or resets that same value, because the rendered page then describes a selection the queries never used. Build the view model first and query with its validated values. Treat it as a defect when a mode or state that the template highlights is inferred by comparing range values rather than read from a marker the writing handler stored.
- path: "**/store/*.go"
  instructions: |-
    Inspect each store method for its deadline, transaction and error contract.
    Treat it as a defect when a method runs its query on the bare caller context with no deadline, because a stalled database then holds a handler goroutine and a pooled connection open for as long as the client waits. Wrap the query context with context.WithTimeout or configure a statement timeout.
    Treat it as a defect when distinct outcomes collapse into one sentinel error. A row that never existed, a row revoked between the preview request and the accepting request, and a row skipped because another transaction holds it are different results. A SELECT with FOR UPDATE SKIP LOCKED returns no row for a locked candidate, so mapping that to a not found error makes the caller report success and lose the retry. Return a separate retryable error and keep not found for the genuinely absent case.
    Treat it as a defect when a method validates state with a SELECT and then writes in a separate statement or transaction, because a concurrent request can pass the same validation and the later unconditional UPDATE overwrites the earlier one. Begin the transaction before the read, lock the row with FOR UPDATE, make the UPDATE conditional on the validated state, and check that RowsAffected is one for every row the request claims to change before committing.
    Treat it as a defect when a method mutates a row that another process may be deleting on a retention schedule, unless the read, the decision and the write share one transaction or a revision counter that changes on every write, because comparing a value before and after proves nothing about what happened in between.
- path: "**/httpapi/*.go"
  instructions: |-
    Inspect every handler that reads or writes data on behalf of a caller.
    Treat it as a defect when the authorization check is not bound to the exact resource named in the request. A helper that confirms the caller manages the target user across all of its groups does not prove access to the group in this request, so the authorizing query must filter by the requested identifier, and the check must run before every store call in the handler, including the branch that resolves a member by email rather than by id.
    Treat it as a defect when the authorizing query does not also constrain the role of the target account, because a staff account that lands in a managed group then becomes readable and editable through the same endpoint.
    Treat it as a defect when a handler proves ownership of a resource but not its kind, for example issuing a public guest link for a group lesson instead of an open event.
    Treat it as a defect when two credential paths cost measurably different time. Skipping the bcrypt comparison for an unknown address makes the response time reveal that the account exists although both bodies are identical, so compare against a static hash in the not found branch.
    Treat it as a defect when a request with an invalid or expired session returns 401 without clearing the session cookie, because the client keeps resending the same broken value.
- path: "backend/**/*.go"
  instructions: |-
    Review every net/http server, client and request decoder in the change.
    Treat it as a defect when http.Server sets only ReadHeaderTimeout. Add ReadTimeout, WriteTimeout and IdleTimeout so no connection stays open indefinitely.
    Treat it as a defect when an outbound http.Client has neither Timeout nor CheckRedirect. ResponseHeaderTimeout ends when the first response header arrives, so a source that stalls in the middle of the body blocks the read with no deadline; wrap the body in a reader that resets an idle timer and closes on expiry. Go also follows up to ten redirects by default, so an https source can be downgraded by a Location header and the payload then travels in cleartext; reject any hop whose scheme is not https.
    Treat it as a defect when json.Decoder.Decode is called once and the rest of the body is ignored, because a second JSON value or a long trailing suffix is then accepted and the advertised body limit is bypassed. Decode again and require io.EOF.
    Treat it as a defect when the error from http.MaxBytesReader reaches the generic validation branch, so an oversized body answers 400 instead of 413.
    Treat it as a defect when an integration counts as configured after only some required fields are checked, for example credentials present while the service URL is empty, or when a constructor that may return a nil client exposes a method that dereferences it. Return a configuration error instead of letting an SDK sign with a placeholder region.
- path: "**/hopper/*.go"
  instructions: |-
    Inspect every value shared between the capture goroutine and the control loop.
    Treat it as a defect when a signal sent on a channel does not carry the identity of the state it belongs to. An unlabelled token produced while visiting channel A can be consumed after the loop has moved to channel B and then extends the wrong visit, and a delayed token can extend a later visit to the same channel. Pass the observed channel and a visit generation with the signal, and accept it only when both match the active visit.
    Treat it as a defect when a mutex protects only part of a transition. Assigning the new current state and draining the stale signal must happen under the same lock, otherwise a valid signal for the new visit is discarded or a stale one survives into it. Set the new state before the drain, then release the lock and accept signals again.
    Treat it as a defect when a select can take the timeout branch while a qualifying event already waits in the buffer, because that event is then dropped at the next transition. Drain pending events without blocking before leaving the loop.
    Treat it as a defect when a timer is recreated with time.NewTimer or time.After for every accepted event, because a burst then allocates at event rate. Keep one timer and call Reset after each extension, and when the extension window is zero wait only on the base timer and on context cancellation.
    Treat it as a defect when an accepted event does not actually move the deadline, for example because the computed extension is still earlier than the existing deadline.
- path: "**/aggregate/*.go"
  instructions: |-
    Check every upsert that writes a time bucket.
    The flush interval is shorter than the bucket, so one bucket reaches the same statement several times in a process lifetime. Treat it as a defect when the statement replaces a bucket wide value with the leader of the current batch, for example COALESCE(excluded.col, col) for a top talker or a victim, because the stored result then reflects the last flush rather than the whole bucket. Aggregate across the bucket before writing, or persist enough per key state to recompute the bucket wide winner.
    Treat it as a defect when a lower bound handed to a detector comes from the earliest row of the current flush instead of the start of the bucket, because rows written by an earlier flush of the same bucket are then excluded and a MAX based event cannot recover them.
    Treat it as a defect when ordering state is maintained in callback order rather than by frame timestamp, or when a timestamp is truncated to a coarser unit before boundaries are compared. The capture source does not deliver frames in timestamp order, so first and last markers and every continuity decision derived from them can be wrong. Keep the full precision timestamp and compare with it.
    Treat it as a defect when a counter that feeds a reason specific event also includes frames that the documented contract excludes, such as protected frames in a spoofing count or client originated frames in an access point failure count. Keep a separate count for the suspicious subset.
    Treat it as a defect when a row demoted or unioned under one key changes what readers of another key see, for example sessions of a demoted device that no reader filters.
- path: "**/*_test.go"
  instructions: |-
    Check each test for the way it can fail.
    Treat it as a defect when a test cannot fail for the behaviour it claims to cover. A select that waits on a result channel with no timeout case turns a stall into the package wide go test timeout instead of a prompt failure, so add a bounded timeout case. An ignored error from Scan, Query or a reload helper lets the test continue with stale values and report a false pass, so assert on the error. A t.Skip taken when a precondition is not met hides the regression the test exists for, so call t.Fatalf and print the value actually observed.
    Treat it as a defect when an assertion still holds after the behaviour under test is removed. Look for a fixture that satisfies the expectation through another code path, a condition that matches an identifier no fixture creates, and a single lower bound that passes even when only the first extension is applied. Add the case that separates the behaviours, such as a second qualifying row, a peer between two already excluded endpoints, or a bound near the documented cap.
    Treat it as a defect when float64 results are compared with equality, because a reordered computation or a changed weight then fails the test for no behavioural reason. Compare with an explicit tolerance.
    Treat it as a defect when a test comment claims coverage of a layer the test never executes, such as persistence proven by a capture level test.
