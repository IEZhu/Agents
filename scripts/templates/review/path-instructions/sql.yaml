# Review guidance for the sql stack, grounded in bot findings on this
# owner's repositories. See docs/review-config.md and the templates README.
- path: "**/*.sql"
  instructions: "Inspect every SELECT in this file that reads a column through a LEFT JOIN or another outer join. Decide for each projected column whether the join can return no matching row, which makes the column NULL even when the base table declares it NOT NULL. Treat it as a defect when the calling code scans that column into a non nullable target such as a Go bool, int64 or string, or aggregates it without a null guard, because the scan fails on the first unmatched row and the caller gets an error instead of a zero. Fix direction: wrap the projected expression in COALESCE with the type correct zero, or read it into a nullable type. Inspect every window function such as ROW_NUMBER, RANK or a SUM OVER clause. Treat it as a defect when the query carries no predicate restricting rows to the period, bucket or tenant the caller displays, because the engine then ranks or sums the whole retention window on each call and the ranking contradicts the filtered view the user sees. Fix direction: push the same period and bucket predicate into the WHERE clause or into PARTITION BY before ranking. Inspect which counter each metric reads. Treat it as a defect when a lifetime or cumulative column, for example a running total kept on a parent row, feeds a metric that the caller scopes to a selected interval, because activity from earlier intervals then shows up inside later ones. Fix direction: aggregate the period scoped child rows for that metric and keep the cumulative column only for all time totals."
- path: "**/migrations/*.sql"
  instructions: "Read this migration together with its paired file for the opposite direction, for example 0005_open_events.up.sql against 0005_open_events.down.sql. List every object the up file creates, including tables, columns, indexes, CHECK and FOREIGN KEY constraints, triggers and enum values. Treat it as a defect when the down file omits one of them, and when the down file removes them in an order that leaves a dependency standing, for example a DROP COLUMN while a CHECK or UNIQUE constraint still references that column, because the engine refuses the drop and the rollback stops with the schema half migrated. Fix direction: drop constraints, indexes and triggers first, then the columns and tables they reference, and give every constraint an explicit name in the up file so the down file can drop it by that name instead of a generated one. Inspect the statement order inside the file as well. Treat it as a defect when a statement references a column, table or constraint that a later statement in the same file creates, or when a NOT NULL column or a UNIQUE index is added to a table that already holds rows without a default, a backfill or a deduplicating step before the constraint, because the migration then fails on every populated database while passing on an empty one. Report the dependency order the statements actually require."
- path: "**/seed.sql"
  instructions: "Inspect every INSERT, UPDATE and DELETE in this seed script and work out which rows it can touch on a database that already holds real data. Treat it as a defect when a statement picks its target rows by a pattern such as an email LIKE match on a shared domain, by an unqualified join from one fixture table to a whole table, or by ORDER BY with LIMIT 1 across all rows, instead of by the explicit keys the script itself inserts, because a rerun then edits unrelated groups, lessons or accounts, and a password or token update can reach an account that was never part of the fixture. Fix direction: name the exact fixture emails, ids or slugs in an IN clause, or add a seed marker column and scope every write to rows carrying that marker, and restrict each INSERT SELECT to the fixture group instead of to all rows of the joined table. Check that the script is safe to run twice. Treat it as a defect when a statement has no ON CONFLICT clause, no WHERE NOT EXISTS guard or equivalent and would duplicate fixture rows or overwrite a value a developer changed locally. Confirm that any credential the script writes stays confined to the fixture accounts."
- path: "**/*.up.sql"
  instructions: "Compare each column this file creates or alters against the domain that its comment, the ADR or the application code states for it. Treat it as a defect when a column documented as a closed set of values, for example a CEFR level from A1 to C2, a role, a status or a kind, is declared as plain text with no CHECK constraint, enum type or lookup table, because any typo or future caller can then persist a value the application cannot interpret and no statement will reject it. Fix direction: add a CHECK constraint listing the allowed values, or a lookup table with a foreign key. Treat it as a defect when a text column that must carry a real value is protected only by NOT NULL, because NOT NULL still accepts an empty string, so add a length check on the trimmed value. Treat it as a defect when a rule that couples two columns lives only in application code, for example a title that is mandatory exactly when the group id is NULL, or a guest token that may exist only on a row without a group, because any other client can write rows that break it. Fix direction: express the rule as a table level CHECK constraint or a partial unique index so the database enforces it, and state which existing rows must be cleaned up before the constraint can be added."
- path: "**/db_creation.sql"
  instructions: "Inspect every UNIQUE constraint and unique index this file declares and check the nullability of each participating column. Treat it as a defect when the constraint exists to stop duplicate rows, for example a key over a symbol plus a calendar year and a period, while one of those columns is nullable, because MySQL, SQLite and PostgreSQL treat each NULL as distinct, so any number of rows holding a NULL in that column still pass and the duplicates the constraint targets keep accumulating. Fix direction: declare the key columns NOT NULL with a backfill or a sentinel value, and place the deduplicating DELETE before the constraint, since creating it on a table that already holds duplicates fails. Check every column type and default against the minimum database version the project declares in its documentation, requirements files or container image. Treat it as a defect when the DDL uses a construct that version rejects, for example a TEXT or BLOB column carrying a DEFAULT clause, which MySQL 5.7 and MariaDB refuse, an expression default on an older MySQL, or several operations inside one SQLite ALTER TABLE. Fix direction: drop the unsupported default and let the column be nullable, or raise the documented minimum version deliberately and record that decision."
