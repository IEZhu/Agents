# Bridge from GitHub events to the cloud issue agent (flows/issue-agent.md).
# Copy to .github/workflows/issue-agent-bridge.yml in the target repository.
#
# Claude Code routine GitHub triggers cover pull request and release events only,
# so this workflow forwards only the configured owner's /agent comments to the routine's
# API trigger. It runs no model and passes only a pointer to the event; the agent
# re-reads and re-verifies the comment itself.
#
# Repository settings (Settings > Secrets and variables > Actions):
#   secret   CLAUDE_ROUTINE_TOKEN  API trigger token of the routine (generated at claude.ai/code/routines)
#   variable CLAUDE_ROUTINE_ID     routine id, trig_...
#   variable AGENT_OWNER           the only GitHub login allowed to issue commands
name: issue-agent-bridge

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  # Serialize redelivery without blocking status/stop behind another startup watch.
  group: issue-agent-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write  # Post and update status comments in PR conversations.
    # Agent comments carry "<!-- issue-agent" and never start with /agent, so the
    # agent cannot trigger itself even though it posts as the owner.
    if: >-
      github.event_name == 'issue_comment'
      && github.event.action == 'created'
      && vars.AGENT_OWNER != ''
      && github.event.comment.user.type == 'User'
      && github.event.comment.user.login == vars.AGENT_OWNER
      && startsWith(github.event.comment.body, '/agent')
      && !contains(github.event.comment.body, '<!-- issue-agent')
    steps:
      # No checkout: comments and PR code never become executable runner code.
      - name: Dispatch and confirm startup
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_OWNER: ${{ vars.AGENT_OWNER }}
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          ROUTINE_ID: ${{ vars.CLAUDE_ROUTINE_ID }}
        shell: python
        run: |
          import datetime
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def request(method, url, token, body=None, anthropic=False):
              headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              if anthropic:
                  headers["anthropic-version"] = "2023-06-01"
              else:
                  headers.update({"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              req = urllib.request.Request(url, data=None if body is None else json.dumps(body).encode(),
                                           headers=headers, method=method)
              try:
                  with urllib.request.build_opener(NoRedirect).open(req, timeout=15) as response:
                      data = response.read()
                      try:
                          parsed = json.loads(data) if data else None
                      except (ValueError, UnicodeError):
                          parsed = None
                      return response.status, parsed, response.headers
              except urllib.error.HTTPError as error:
                  # Never print API bodies, which may contain sensitive account details.
                  return error.code, None, error.headers

          def main():
              env = os.environ
              with open(env["GITHUB_EVENT_PATH"]) as handle:
                  event = json.load(handle)
              kind, repo = env["GITHUB_EVENT_NAME"], env["GITHUB_REPOSITORY"]
              owner = env.get("AGENT_OWNER", "")
              if kind != "issue_comment" or not owner:
                  return
              source = event["comment"]
              user = source.get("user") or {}
              body = source.get("body") or ""
              if (event.get("action") != "created" or user.get("type") != "User"
                      or user.get("login") != owner or not re.match(r"^/agent(?:\s|$)", body)
                      or "<!-- issue-agent" in body):
                  return
              number = event["issue"]["number"]

              api = f"{env['GITHUB_API_URL']}/repos/{repo}"
              run_url = f"{env['GITHUB_SERVER_URL']}/{repo}/actions/runs/{env['GITHUB_RUN_ID']}"
              marker = f"<!-- issue-agent:bridge event={kind} id={source['id']} -->"
              comment_id = None
              reaction_marker = ""

              def github(method, path, body=None):
                  code, data, _ = request(method, api + path, env["GH_TOKEN"], body)
                  if not 200 <= code < 300:
                      raise RuntimeError(f"GitHub API returned HTTP {code}")
                  return data

              def comments(since=None, deadline=None):
                  query = "per_page=100"
                  if since:
                      query += "&since=" + urllib.parse.quote(since, safe="")
                  for page in range(1, 101):
                      if deadline is not None and time.monotonic() >= deadline:
                          return
                      batch = github("GET", f"/issues/{number}/comments?{query}&page={page}")
                      yield from batch
                      if len(batch) < 100:
                          return
                  raise RuntimeError("Comment pagination limit reached")

              def status(message):
                  nonlocal comment_id
                  data = {"body": f"{marker}\n{reaction_marker}{message}\n\n[Bridge run]({run_url})."}
                  if comment_id is None:
                      comment_id = github("POST", f"/issues/{number}/comments", data)["id"]
                  else:
                      github("PATCH", f"/issues/comments/{comment_id}", data)

              # A receipt prevents duplicate sessions after Actions reruns, including ambiguous failures.
              for comment in comments():
                  user = comment.get("user") or {}
                  if (user.get("login") == "github-actions[bot]" and user.get("type") == "Bot"
                          and (comment.get("body") or "").splitlines()[:1] == [marker]):
                      print("This event already has a bridge receipt; no second session was created.")
                      return

              since = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(seconds=60)).isoformat()
              status("👀 Command received. Waiting for Claude to confirm startup (up to 5 minutes).")
              reaction_target = source["id"]
              reaction_path = f"/issues/comments/{reaction_target}/reactions"
              session = ""
              fired = False
              try:
                  try:
                      code, reaction, _ = request("POST", api + reaction_path, env["GH_TOKEN"], {"content": "eyes"})
                      if code == 201:
                          # Only remove a reaction created by this run, never a pre-existing one.
                          with open(env["GITHUB_OUTPUT"], "a") as output:
                              output.write(f"reaction_path={reaction_path}/{reaction['id']}\n")
                          reaction_marker = f"<!-- issue-agent:reaction id={reaction['id']} -->\n"
                      elif code != 200:
                          print("::warning::Could not add the bridge reaction; continuing dispatch.")
                  except Exception:
                      print("::warning::Could not add the bridge reaction; continuing dispatch.")
                  if not env.get("ROUTINE_TOKEN") or not re.fullmatch(r"trig_[A-Za-z0-9]+", env.get("ROUTINE_ID", "")):
                      status("Launch blocked: configure CLAUDE_ROUTINE_TOKEN and CLAUDE_ROUTINE_ID in this repository. Send a new command after fixing the configuration.")
                      return
                  text = (f"repo={repo} event={kind} number={number} "
                          f"comment_id={source['id']} "
                          f"bridge_comment_id={comment_id}")
                  # Persist cleanup ownership before Claude can post its completion.
                  status("👀 Command received. Waiting for Claude to confirm startup (up to 5 minutes).")
                  fired = True
                  code, response, headers = request(
                      "POST", f"https://api.anthropic.com/v1/claude_code/routines/{env['ROUTINE_ID']}/fire",
                      env["ROUTINE_TOKEN"], {"text": text}, anthropic=True)
                  if code == 429:
                      retry = headers.get("Retry-After", "")
                      wait = f" Retry after {int(retry)} seconds." if re.fullmatch(r"[0-9]{1,8}", retry) else " Try again after the limit resets."
                      status("Claude rejected the launch: the routine API rate limit was reached." + wait + " Send a new `/agent` command then; no automatic retry was made.")
                      return
                  if code != 200:
                      certainty = "Launch rejected" if 400 <= code < 500 else "Launch not confirmed"
                      status(f"{certainty}: Claude API returned HTTP {code}. Check the routine before sending a new command; no automatic retry was made.")
                      return
                  session_id = response.get("claude_code_session_id", "") if isinstance(response, dict) else ""
                  if isinstance(session_id, str) and re.fullmatch(r"session_[A-Za-z0-9]+", session_id):
                      session = f"[Claude session](https://claude.ai/code/{session_id})"
                      status(f"Session created: {session}. Waiting for Claude to confirm startup (up to 5 minutes).")
                  else:
                      session = f"[Claude routine](https://claude.ai/code/routines/{env['ROUTINE_ID']})"
                      status(f"Claude accepted the request, but returned no usable session ID. {session}. "
                             "Waiting for Claude to confirm startup (up to 5 minutes); no automatic retry was made.")
                  ack = f"<!-- issue-agent:started bridge_comment_id={comment_id} -->"
                  deadline = time.monotonic() + 300
                  while True:
                      for comment in comments(since, deadline):
                          if ((comment.get("user") or {}).get("type") == "User"
                                  and (comment.get("user") or {}).get("login") == owner
                                  and (comment.get("body") or "").splitlines()[:2] == ["<!-- issue-agent -->", ack]):
                              status(f"Claude confirmed startup. {session}. The agent posts progress and the result in this thread.")
                              if reaction_marker:
                                  with open(env["GITHUB_OUTPUT"], "a") as output:
                                      output.write("keep_reaction=true\n")
                              return
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          break
                      time.sleep(min(15, remaining))
                  status(f"Claude did not confirm startup within 5 minutes. {session}. "
                         "A session usage limit or a startup problem may be blocking it. Open the session or routine for details. "
                         "No automatic retry was made. If it is still running, wait; otherwise send a new `/agent` "
                         "command after resolving the problem.")
              except Exception:
                  # Transport exceptions can embed URLs or account data; keep them out of logs.
                  message = ("Launch or startup confirmation is uncertain." if fired else "The bridge could not prepare the launch.")
                  status(f"{message} {session} Check the routine and this workflow before sending a new command; no automatic retry was made.")
                  raise RuntimeError("Bridge failed; see its status comment.") from None

          if __name__ == "__main__":
              main()

      - name: Clear the bridge reaction
        if: ${{ always() && steps.dispatch.outputs.reaction_path != '' && steps.dispatch.outputs.keep_reaction != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REACTION_PATH: ${{ steps.dispatch.outputs.reaction_path }}
        shell: bash
        run: |
          # Failed or unconfirmed startup: remove only this run's reaction.
          code=$(curl --silent --show-error --max-time 15 --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output /dev/null --write-out '%{http_code}' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}${REACTION_PATH}")
          if [ "$code" != 204 ] && [ "$code" != 404 ]; then
            echo "::warning::Could not clear the bridge reaction (HTTP $code)."
            exit 1
          fi

  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write  # Remove the recorded reaction from PR conversation comments.
    if: >-
      github.event_name == 'issue_comment'
      && github.event.action == 'created'
      && vars.AGENT_OWNER != ''
      && github.event.comment.user.type == 'User'
      && github.event.comment.user.login == vars.AGENT_OWNER
      && startsWith(github.event.comment.body, '<!-- issue-agent -->')
      && contains(github.event.comment.body, '<!-- issue-agent:finished bridge_comment_id=')
    steps:
      - name: Clear the completed command reaction
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_OWNER: ${{ vars.AGENT_OWNER }}
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          class GitHubError(RuntimeError):
              pass

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def request(method, url, token, body=None):
              req = urllib.request.Request(url, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.build_opener(NoRedirect).open(req, timeout=15) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None, response.headers
              except urllib.error.HTTPError as error:
                  return error.code, None, error.headers

          def main():
              env = os.environ
              with open(env["GITHUB_EVENT_PATH"]) as handle:
                  event = json.load(handle)
              owner = env.get("AGENT_OWNER", "")
              if env["GITHUB_EVENT_NAME"] != "issue_comment" or not owner or event.get("action") != "created":
                  return

              def author(comment, login, user_type):
                  user = comment.get("user") or {}
                  return user.get("login") == login and user.get("type") == user_type

              completion = event["comment"]
              lines = (completion.get("body") or "").splitlines()
              if not author(completion, owner, "User") or len(lines) < 2 or lines[0] != "<!-- issue-agent -->":
                  return
              match = re.fullmatch(r"<!-- issue-agent:finished bridge_comment_id=([1-9][0-9]*) -->", lines[1])
              if not match:
                  return
              api = f"{env['GITHUB_API_URL']}/repos/{env['GITHUB_REPOSITORY']}"
              issue_url = f"{api}/issues/{event['issue']['number']}"

              def github(method, path, stage):
                  code, data, _ = request(method, api + path, env["GH_TOKEN"])
                  if code == 404:
                      return None
                  if not 200 <= code < 300:
                      raise GitHubError(f"GitHub {stage} ({method}) returned HTTP {int(code)}.")
                  return data

              receipt = github("GET", f"/issues/comments/{match[1]}", "read bridge receipt")
              if (not receipt or receipt.get("issue_url") != issue_url
                      or not author(receipt, "github-actions[bot]", "Bot")):
                  return
              lines = (receipt.get("body") or "").splitlines()
              if len(lines) < 2:
                  return
              command = re.fullmatch(r"<!-- issue-agent:bridge event=issue_comment id=([1-9][0-9]*) -->", lines[0])
              reaction = re.fullmatch(r"<!-- issue-agent:reaction id=([1-9][0-9]*) -->", lines[1])
              if not command or not reaction:
                  return
              source = github("GET", f"/issues/comments/{command[1]}", "read source command")
              if (not source or source.get("issue_url") != issue_url or not author(source, owner, "User")
                      or not re.match(r"^/agent(?:\s|$)", source.get("body") or "")
                      or "<!-- issue-agent" in (source.get("body") or "")):
                  return
              path = f"/issues/comments/{command[1]}/reactions"
              for page in range(1, 101):
                  batch = github("GET", f"{path}?per_page=100&page={page}", "list command reactions") or []
                  for item in batch:
                      if (item.get("id") == int(reaction[1]) and item.get("content") == "eyes"
                              and author(item, "github-actions[bot]", "Bot")):
                          github("DELETE", f"{path}/{reaction[1]}", "delete command reaction")
                          return
                  if len(batch) < 100:
                      return
              raise RuntimeError("Reaction pagination limit reached")

          def run():
              try:
                  main()
              except GitHubError as error:
                  raise RuntimeError(str(error)) from None
              except Exception:
                  raise RuntimeError("Could not clear the completed command reaction.") from None

          if __name__ == "__main__":
              run()
