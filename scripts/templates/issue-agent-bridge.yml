# Bridge from GitHub events to the cloud issue agent (flows/issue-agent.md).
# Copy to .github/workflows/issue-agent-bridge.yml in the target repository.
#
# Claude Code routine GitHub triggers cover pull request and release events only,
# so this workflow forwards /agent comments and review-bot reviews to the routine's
# API trigger. It runs no model and passes only a pointer to the event; the agent
# re-reads and re-verifies the comment itself.
#
# Repository settings (Settings > Secrets and variables > Actions):
#   secret   CLAUDE_ROUTINE_TOKEN  API trigger token of the routine (generated at claude.ai/code/routines)
#   variable CLAUDE_ROUTINE_ID     routine id, trig_...
#   variable AGENT_OWNER           the only GitHub login allowed to issue commands
name: issue-agent-bridge

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: issue-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Agent comments carry "<!-- issue-agent" and never start with /agent, so the
    # agent cannot trigger itself even though it posts as the owner.
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.comment.user.login == vars.AGENT_OWNER
        && startsWith(github.event.comment.body, '/agent')
        && !contains(github.event.comment.body, '<!-- issue-agent'))
      || (github.event_name == 'pull_request_review'
        && contains(fromJSON('["copilot-pull-request-reviewer[bot]", "coderabbitai[bot]"]'), github.event.review.user.login)
        && github.event.pull_request.head.repo.full_name == github.repository
        && startsWith(github.event.pull_request.head.ref, 'claude/issue-'))
    steps:
      - name: Fire the routine
        env:
          EVENT: ${{ github.event_name }}
          BODY: ${{ github.event.comment.body }}
          TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          ROUTINE_ID: ${{ vars.CLAUDE_ROUTINE_ID }}
          TEXT: >-
            repo=${{ github.repository }}
            event=${{ github.event_name }}
            number=${{ github.event.issue.number || github.event.pull_request.number }}
            comment_id=${{ github.event.comment.id }}
            review_id=${{ github.event.review.id }}
        run: |
          # "/agent" must be a whole word: followed by whitespace or the end.
          if [ "$EVENT" = issue_comment ] && ! printf '%s' "$BODY" | head -n 1 | grep -Eq '^/agent([[:space:]]|$)'; then
            echo "Not a /agent command"; exit 0
          fi
          jq -n --arg text "$TEXT" '{text: $text}' |
            curl -fsS -X POST "https://api.anthropic.com/v1/claude_code/routines/${ROUTINE_ID}/fire" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "Content-Type: application/json" \
              --data-binary @- -o /dev/null
