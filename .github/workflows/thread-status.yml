name: Thread status

on:
  pull_request:
    paths:
      - src/thread_status.py
      - src/codex_thread_titles.py
      - scripts/thread_status.py
      - scripts/thread_status_interrupt.py
      - scripts/install_thread_status.py
      - scripts/install_client_hooks.py
      - scripts/install_setup_options.py
      - scripts/init_repo.sh
      - scripts/init_repo.bat
      - tests/test_install_setup_options.py
      - tests/test_hook_config_concurrency.py
      - tests/test_install_client_hooks.py
      - scripts/install_session_readiness.py
      - scripts/_helpers/backup_file.py
      - src/client_paths.py
      - tests/test_thread_status*.py
      - tests/test_codex_thread_titles.py
      - tests/conftest.py
      - requirements.txt
      - .github/workflows/thread-status.yml
  push:
    branches: [main, dev]
    paths:
      - src/thread_status.py
      - src/codex_thread_titles.py
      - scripts/thread_status.py
      - scripts/thread_status_interrupt.py
      - scripts/install_thread_status.py
      - scripts/install_client_hooks.py
      - scripts/install_setup_options.py
      - scripts/init_repo.sh
      - scripts/init_repo.bat
      - tests/test_install_setup_options.py
      - tests/test_hook_config_concurrency.py
      - tests/test_install_client_hooks.py
      - scripts/install_session_readiness.py
      - scripts/_helpers/backup_file.py
      - src/client_paths.py
      - tests/test_thread_status*.py
      - tests/test_codex_thread_titles.py
      - tests/conftest.py
      - requirements.txt
      - .github/workflows/thread-status.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thread-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      LANGFUSE_TRACING_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Formatter, native hook events, interrupt watcher, installation and metadata transport
        run: python -B -m pytest tests/test_thread_status.py tests/test_thread_status_interrupt.py tests/test_thread_status_installer.py tests/test_codex_thread_titles.py tests/test_install_client_hooks.py tests/test_install_setup_options.py tests/test_hook_config_concurrency.py -q -p no:cacheprovider
