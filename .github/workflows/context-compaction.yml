name: Context compaction

on:
  pull_request:
    paths:
      - src/context_compaction/**
      - scripts/context_compaction.py
      - scripts/install_context_compaction.py
      - plugins/agents-core-context-compaction/**
      - .claude-plugin/marketplace.json
      - pyproject.toml
      - tests/test_context_compaction*.py
      - .github/workflows/context-compaction.yml
  push:
    branches: [main, dev]
    paths:
      - src/context_compaction/**
      - scripts/context_compaction.py
      - scripts/install_context_compaction.py
      - plugins/agents-core-context-compaction/**
      - pyproject.toml
      - tests/test_context_compaction*.py
      - .github/workflows/context-compaction.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-compaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      LANGFUSE_TRACING_ENABLED: 'false'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Configuration, hooks, installer and fake Cursor UI
        run: python -B -m pytest tests/test_context_compaction.py tests/test_context_compaction_cursor.py -q -p no:cacheprovider
      - name: Claude mod orchestration
        run: node --test plugins/agents-core-context-compaction/tests/compaction.test.js
