name: Windows installer

on:
  pull_request:
    paths:
      - scripts/init_repo.bat
      - scripts/_helpers/check_version.py
      - tests/test_installer_windows.py
      - tests/conftest.py
      - .github/workflows/windows-installer.yml
  push:
    branches: [main]
    paths:
      - scripts/init_repo.bat
      - scripts/_helpers/check_version.py
      - tests/test_installer_windows.py
      - tests/conftest.py
      - .github/workflows/windows-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: python310
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest python-dotenv
      - name: Exercise native cmd.exe installer prompts
        env:
          AGENTS_TEST_PYTHON310: ${{ steps.python310.outputs.python-path }}
        run: python -m pytest tests/test_installer_windows.py -v
