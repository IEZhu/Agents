name: Windows installer

on:
  pull_request:
    paths:
      - .gitattributes
      - scripts/init_repo.bat
      - scripts/init_repo.sh
      - scripts/install_instructions.py
      - src/client_paths.py
      - src/daemon/peer.py
      - scripts/dev/peer_check_probe.py
      - scripts/_helpers/check_version.py
      - scripts/_helpers/client_config_paths.py
      - scripts/_helpers/install_codex_instructions.py
      - scripts/_helpers/inject_claude_md.py
      - scripts/_helpers/migrate_routing_memory.py
      - scripts/templates/**/*.md
      - tests/test_installer_windows.py
      - tests/test_installer_instructions.py
      - tests/test_installer_profiles.py
      - tests/test_install_instructions.py
      - tests/test_codex_instructions.py
      - tests/test_protocol_migration.py
      - tests/test_daemon_peer.py
      - tests/conftest.py
      - .github/workflows/windows-installer.yml
  push:
    branches: [main]
    paths:
      - .gitattributes
      - scripts/init_repo.bat
      - scripts/init_repo.sh
      - scripts/install_instructions.py
      - src/client_paths.py
      - src/daemon/peer.py
      - scripts/dev/peer_check_probe.py
      - scripts/_helpers/check_version.py
      - scripts/_helpers/client_config_paths.py
      - scripts/_helpers/install_codex_instructions.py
      - scripts/_helpers/inject_claude_md.py
      - scripts/_helpers/migrate_routing_memory.py
      - scripts/templates/**/*.md
      - tests/test_installer_windows.py
      - tests/test_installer_instructions.py
      - tests/test_installer_profiles.py
      - tests/test_install_instructions.py
      - tests/test_codex_instructions.py
      - tests/test_protocol_migration.py
      - tests/test_daemon_peer.py
      - tests/conftest.py
      - .github/workflows/windows-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Preserve source line endings for byte-exact migration checks
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: python310
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest python-dotenv
      - name: Exercise native installer prompts, instruction migrations and the loopback peer check
        env:
          AGENTS_TEST_PYTHON310: ${{ steps.python310.outputs.python-path }}
        run: >-
          python -m pytest tests/test_installer_windows.py
          tests/test_installer_instructions.py tests/test_codex_instructions.py
          tests/test_install_instructions.py tests/test_installer_profiles.py
          tests/test_protocol_migration.py tests/test_daemon_peer.py -v
      - name: Recognize a same-user connection as a standard (non-administrator) user
        shell: pwsh
        run: |
          $plain = 'Pc1!' + [guid]::NewGuid().ToString('N')
          $secure = ConvertTo-SecureString $plain -AsPlainText -Force
          New-LocalUser -Name peercheck -Password $secure -AccountNeverExpires | Out-Null
          $python = (Get-Command python).Source
          $root = Split-Path (Split-Path $python)
          foreach ($path in @($env:GITHUB_WORKSPACE, $root, $env:RUNNER_TEMP)) {
            icacls $path /grant 'peercheck:(OI)(CI)RX' /T /C /Q | Out-Null
          }
          $out = Join-Path $env:RUNNER_TEMP 'peer-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'peer-err.txt'
          icacls $env:RUNNER_TEMP /grant 'peercheck:(OI)(CI)M' /C /Q | Out-Null
          $credential = [pscredential]::new("$env:COMPUTERNAME\peercheck", $secure)
          $process = Start-Process -FilePath $python -Credential $credential -Wait -PassThru `
            -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $out -RedirectStandardError $err `
            -ArgumentList @("$env:GITHUB_WORKSPACE\scripts\dev\peer_check_probe.py", $env:GITHUB_WORKSPACE)
          Get-Content $out, $err -ErrorAction SilentlyContinue
          Remove-LocalUser -Name peercheck
          if ($process.ExitCode -ne 0) { throw "peer check failed for a standard user: $($process.ExitCode)" }
