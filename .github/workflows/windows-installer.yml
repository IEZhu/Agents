name: Windows installer

on:
  pull_request:
    paths:
      - scripts/init_repo.bat
      - scripts/init_repo.sh
      - scripts/_helpers/check_version.py
      - scripts/_helpers/install_codex_instructions.py
      - scripts/_helpers/inject_claude_md.py
      - scripts/_helpers/migrate_routing_memory.py
      - scripts/templates/*.md
      - tests/test_installer_windows.py
      - tests/test_installer_instructions.py
      - tests/test_codex_instructions.py
      - tests/test_protocol_migration.py
      - tests/conftest.py
      - .github/workflows/windows-installer.yml
  push:
    branches: [main]
    paths:
      - scripts/init_repo.bat
      - scripts/init_repo.sh
      - scripts/_helpers/check_version.py
      - scripts/_helpers/install_codex_instructions.py
      - scripts/_helpers/inject_claude_md.py
      - scripts/_helpers/migrate_routing_memory.py
      - scripts/templates/*.md
      - tests/test_installer_windows.py
      - tests/test_installer_instructions.py
      - tests/test_codex_instructions.py
      - tests/test_protocol_migration.py
      - tests/conftest.py
      - .github/workflows/windows-installer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Preserve source line endings for byte-exact migration checks
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        id: python310
        with:
          python-version: '3.10'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest python-dotenv
      - name: Exercise native installer prompts and instruction migrations
        env:
          AGENTS_TEST_PYTHON310: ${{ steps.python310.outputs.python-path }}
        run: >-
          python -m pytest tests/test_installer_windows.py
          tests/test_installer_instructions.py tests/test_codex_instructions.py
          tests/test_protocol_migration.py -v
