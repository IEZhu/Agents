name: Instruction protocols

on:
  pull_request:
    paths:
      - CLAUDE.md
      - scripts/templates/**
      - src/engine/persona.py
      - src/server.py
      - flows/**
      - tests/test_persona_protocol.py
      - tests/test_flows.py
      - tests/test_install_instructions.py
      - tests/test_installer_profiles.py
      - tests/test_protocol_migration.py
      - tests/conftest.py
      - requirements.txt
      - pyproject.toml
      - .github/workflows/instruction-protocol.yml
  push:
    branches: [main, dev]
    paths:
      - CLAUDE.md
      - scripts/templates/**
      - src/engine/persona.py
      - src/server.py
      - flows/**
      - tests/test_persona_protocol.py
      - tests/test_flows.py
      - tests/test_install_instructions.py
      - tests/test_installer_profiles.py
      - tests/test_protocol_migration.py
      - tests/conftest.py
      - requirements.txt
      - pyproject.toml
      - .github/workflows/instruction-protocol.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instruction-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LANGFUSE_TRACING_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Preserve exact instruction bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Instruction delivery, flow catalogues and reminder migration
        run: >-
          python -B -m pytest tests/test_persona_protocol.py tests/test_flows.py
          tests/test_install_instructions.py tests/test_installer_profiles.py
          tests/test_protocol_migration.py -q -p no:cacheprovider
