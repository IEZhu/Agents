name: User sync

on:
  pull_request:
    paths:
      - src/user_sync/**
      - src/user_library.py
      - src/user_flows.py
      - src/component_toggles.py
      - src/file_lock.py
      - tests/test_user_sync*.py
      - tests/conftest.py
      - .github/workflows/user-sync.yml
  push:
    branches: [main]
    paths:
      - src/user_sync/**
      - src/user_library.py
      - src/user_flows.py
      - src/component_toggles.py
      - src/file_lock.py
      - tests/test_user_sync*.py
      - tests/conftest.py
      - .github/workflows/user-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep source bytes exact
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest python-dotenv pyyaml
      - name: Show the git and OpenSSH versions sync runs with
        run: git version && (ssh -V 2>&1 || true)
      - name: Sync the library between two machines through a local bare repository
        run: python -m pytest tests/test_user_sync*.py -v
