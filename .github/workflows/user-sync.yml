name: User sync

on:
  pull_request:
    paths:
      - src/user_sync/**
      - src/user_library.py
      - src/library_history.py
      - src/user_flows.py
      - src/component_toggles.py
      - src/file_lock.py
      - src/memory/history.py
      - src/executables.py
      - tests/test_user_sync*.py
      - tests/test_executables.py
      - tests/test_library_history.py
      - tests/conftest.py
      - tests/ci_shard.py
      - tests/test_ci_shard.py
      - .github/workflows/user-sync.yml
  push:
    branches: [main, dev]
    paths:
      - src/user_sync/**
      - src/user_library.py
      - src/library_history.py
      - src/user_flows.py
      - src/component_toggles.py
      - src/file_lock.py
      - src/memory/history.py
      - src/executables.py
      - tests/test_user_sync*.py
      - tests/test_executables.py
      - tests/test_library_history.py
      - tests/conftest.py
      - tests/ci_shard.py
      - tests/test_ci_shard.py
      - .github/workflows/user-sync.yml
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running check of the older head pointless.
concurrency:
  group: user-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, shard ${{ matrix.shard_index }}/${{ matrix.shard_count }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard_count: 1
            shard_index: 0
          # The GitHub token's real Keychain and Credential Manager round trips
          # (tests/test_user_sync_github.py) write a uniquely named item and delete it.
          # Linux runners have no Secret Service session, so that test skips there.
          - os: windows-latest
            real_secret_store: "1"
            shard_count: 4
            shard_index: 0
          - os: windows-latest
            real_secret_store: "1"
            shard_count: 4
            shard_index: 1
          - os: windows-latest
            real_secret_store: "1"
            shard_count: 4
            shard_index: 2
          - os: windows-latest
            real_secret_store: "1"
            shard_count: 4
            shard_index: 3
          - os: macos-latest
            real_secret_store: "1"
            shard_count: 1
            shard_index: 0
    runs-on: ${{ matrix.os }}
    # Native Windows Git cycles exceed one job's budget; shards retain the full collection.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep source bytes exact
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest python-dotenv pyyaml
      - name: Show the git and OpenSSH versions sync runs with
        run: git version && (ssh -V 2>&1 || true)
      - name: Sync through local bare repositories, GitHub through a fake API
        env:
          # Throwaway runners: install, query and remove a real scheduled job on each OS,
          # and use the real Keychain and Credential Manager where the matrix allows it.
          AGENTS_TEST_REAL_SCHEDULER: "1"
          AGENTS_TEST_REAL_SECRET_STORE: ${{ matrix.real_secret_store || '0' }}
          AGENTS_TEST_SHARD_COUNT: ${{ matrix.shard_count }}
          AGENTS_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
        run: python -m pytest -p tests.ci_shard tests/test_ci_shard.py tests/test_library_history.py tests/test_user_sync*.py -v -x --tb=short --durations=15
      # Sync starts git, ssh-keygen and ssh-keyscan through src/executables.py (#244); its POSIX
      # checks (root-owned chains, symlinks, the service's environment) run nowhere else.
      - name: Tool paths and the service's environment
        run: python -m pytest tests/test_executables.py -v
