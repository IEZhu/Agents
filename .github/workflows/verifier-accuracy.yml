name: Verifier accuracy

# The Documentation workflow runs the harness's tests on Linux for every pull request.
# This run adds macOS, the platform the measurement runs on (sandbox-exec), on a path filter.
on:
  pull_request:
    paths:
      - evals/verifier_accuracy/**
      - evals/scripts/verifier_accuracy.py
      - tests/test_verifier_accuracy.py
      - .github/workflows/verifier-accuracy.yml
  push:
    branches: [main, dev]
    paths:
      - evals/verifier_accuracy/**
      - evals/scripts/verifier_accuracy.py
      - tests/test_verifier_accuracy.py
      - .github/workflows/verifier-accuracy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-accuracy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      LANGFUSE_TRACING_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check the verifier-accuracy harness (fake workers, no model and no network)
        run: python -B -m pytest tests/test_verifier_accuracy.py -q -p no:cacheprovider
