name: Release version

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install focused test dependencies
        run: python3 -m pip install pytest python-dotenv pyyaml
      - name: Check release behavior and workflow permissions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          LANGFUSE_TRACING_ENABLED: "false"
        run: python3 -m pytest tests/test_release_version.py tests/test_workflow_permissions.py -q
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'dev' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Different promotions can run independently; duplicate runs are idempotent.
    concurrency:
      group: release-version-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out the merged release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Record the calendar release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_version.py
