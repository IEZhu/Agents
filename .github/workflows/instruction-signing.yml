name: Instruction signing

on:
  pull_request:
    paths:
      - src/instruction_signing/**
      - tests/test_instruction_signing*.py
      - tests/test_instruction_inventory.py
      - tests/conftest.py
      - pyproject.toml
      - requirements.txt
      - uv.lock
      - .github/workflows/instruction-signing.yml
  push:
    branches: [main, dev]
    paths:
      - src/instruction_signing/**
      - tests/test_instruction_signing*.py
      - tests/test_instruction_inventory.py
      - tests/conftest.py
      - pyproject.toml
      - requirements.txt
      - uv.lock
      - .github/workflows/instruction-signing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instruction-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LANGFUSE_TRACING_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Preserve signed fixture bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install runtime and pinned reference test dependencies
        run: python -m pip install -r requirements.txt -e ".[signing-tests]"
      - name: OMS interoperability and adversarial protected-set checks
        run: python -B -m pytest tests/test_instruction_signing.py tests/test_instruction_signing_interop.py tests/test_instruction_inventory.py -q -p no:cacheprovider
