name: Documentation

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANGFUSE_TRACING_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install check dependencies
        run: python -m pip install -r requirements.txt 'markdown-it-py>=3,<5'
      - name: Check local navigation, public tool references and badge freshness
        run: python -B scripts/check_docs.py
      - name: Check parser, registrations, flow contracts and workflow permissions
        run: python -B -m pytest tests/test_check_docs.py tests/test_flows.py tests/test_workflow_permissions.py -q -p no:cacheprovider
