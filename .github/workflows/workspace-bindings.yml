name: Workspace bindings

on:
  pull_request:
    paths:
      - bridge/**
      - src/engine/config.py
      - src/daemon/**
      - src/startup.py
      - src/server.py
      - src/stdio_workspace.py
      - scripts/_helpers/**
      - scripts/init_repo.*
      - tests/test_workspace_auto.py
      - tests/test_standalone_workspace*.py
      - tests/test_python*.py
      - tests/test_config_client_root.py
      - tests/test_daemon*.py
      - tests/test_codex_mcp.py
      - tests/test_startup.py
      - tests/test_server_describe.py
      - tests/test_server_flows.py
      - tests/test_installer_instructions.py
      - tests/test_daemon_runtime_override.py
      - src/memory/history.py
      - requirements.txt
      - .github/workflows/workspace-bindings.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-bindings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      LANGFUSE_TRACING_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Workspace resolution, installer migration and memory writes
        run: python -B -m pytest tests/test_workspace_auto.py tests/test_config_client_root.py tests/test_daemon.py tests/test_daemon_clients.py tests/test_daemon_registrations.py tests/test_codex_mcp.py tests/test_startup.py tests/test_server_describe.py tests/test_server_flows.py tests/test_installer_instructions.py tests/test_daemon_runtime_override.py tests/test_python_stdio_bridge.py tests/test_python_workspace_hook.py tests/test_standalone_workspace.py tests/test_standalone_workspace_mcp.py tests/test_history.py::TestAppend tests/test_history.py::TestDedup -q -p no:cacheprovider
      - name: Node bridge session isolation and authenticated hooks
        run: node --test bridge/test.mjs
