name: Uninstall

on:
  pull_request:
    paths:
      - src/uninstall.py
      - src/client_paths.py
      - scripts/uninstall.sh
      - scripts/uninstall.ps1
      - scripts/_helpers/inject_claude_md.py
      - scripts/_helpers/migrate_routing_memory.py
      - scripts/templates/**/*.md
      - tests/test_uninstall.py
      - tests/conftest.py
      - .github/workflows/uninstall.yml
  push:
    branches: [main]
    paths:
      - src/uninstall.py
      - src/client_paths.py
      - scripts/uninstall.sh
      - scripts/uninstall.ps1
      - scripts/_helpers/inject_claude_md.py
      - scripts/_helpers/migrate_routing_memory.py
      - scripts/templates/**/*.md
      - tests/test_uninstall.py
      - tests/conftest.py
      - .github/workflows/uninstall.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uninstall:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Preserve source line endings for byte-exact checks
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest python-dotenv
      # Every test runs on a temporary home with a fake runner; the platform branches
      # (macOS, Linux, Windows) are injected, so each runner exercises all three.
      - name: Uninstall on a temporary home
        run: python -m pytest tests/test_uninstall.py -v
      - name: The entry point starts with the system Python (POSIX)
        if: runner.os != 'Windows'
        run: scripts/uninstall.sh --help
      - name: The entry point starts with the system Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/uninstall.ps1 --help
