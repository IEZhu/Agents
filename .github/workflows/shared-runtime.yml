name: Shared runtime

on:
  pull_request:
    paths:
      - src/artifacts/**
      - src/cooperation/**
      - src/local_inference/**
      - src/runtime_paths.py
      - src/schemas/artifacts.py
      - src/schemas/subagent.py
      - src/engine/subagent.py
      - src/engine/onnx_embedding.py
      - src/engine/embedding_catalog.json
      - src/engine/embedder.py
      - src/engine/embedding_prompts.py
      - src/engine/fingerprint.py
      - src/server.py
      - src/daemon/app.py
      - src/daemon/control.py
      - src/daemon/autoupdate.py
      - src/daemon/update.py
      - src/daemon/update_dependencies.py
      - src/version.py
      - src/daemon/mcp_proxy/**
      - src/daemon/mcp_ui.py
      - src/daemon/mcp_ui.html
      - src/daemon/flows_ui.html
      - src/daemon/mcp_cli.py
      - src/mcp_registry.py
      - src/mcp_secrets.py
      - src/user_sync/**
      - tests/test_mcp*.py
      - tests/test_sync_ui_blocked.py
      - tests/test_user_sync_blocked.py
      - tests/test_daemon.py
      - tests/test_history_ui.py
      - rules/subagents/**
      - tests/test_artifact*.py
      - tests/test_cooperation*.py
      - tests/test_subagent*.py
      - tests/test_local_inference*.py
      - tests/local_inference_fake.py
      - tests/test_optional_inference_disabled.py
      - tests/test_onnx_embedding.py
      - tests/test_embedder.py
      - tests/test_embedding_prompts.py
      - tests/test_daemon_runtime_override.py
      - tests/test_daemon_autoupdate.py
      - tests/test_daemon_update.py
      - tests/test_daemon_update_dependencies.py
      - tests/test_version.py
      - tests/conftest.py
      - requirements.txt
      - pyproject.toml
      - .github/workflows/shared-runtime.yml
  push:
    branches: [main, dev]
    paths:
      - src/artifacts/**
      - src/cooperation/**
      - src/local_inference/**
      - src/runtime_paths.py
      - src/schemas/artifacts.py
      - src/schemas/subagent.py
      - src/engine/subagent.py
      - src/engine/onnx_embedding.py
      - src/engine/embedding_catalog.json
      - src/engine/embedder.py
      - src/engine/embedding_prompts.py
      - src/engine/fingerprint.py
      - src/server.py
      - src/daemon/app.py
      - src/daemon/control.py
      - src/daemon/autoupdate.py
      - src/daemon/update.py
      - src/daemon/update_dependencies.py
      - src/version.py
      - src/daemon/mcp_proxy/**
      - src/daemon/mcp_ui.py
      - src/daemon/mcp_ui.html
      - src/daemon/flows_ui.html
      - src/daemon/mcp_cli.py
      - src/mcp_registry.py
      - src/mcp_secrets.py
      - src/user_sync/**
      - tests/test_mcp*.py
      - tests/test_sync_ui_blocked.py
      - tests/test_user_sync_blocked.py
      - tests/test_daemon.py
      - tests/test_history_ui.py
      - rules/subagents/**
      - tests/test_artifact*.py
      - tests/test_cooperation*.py
      - tests/test_subagent*.py
      - tests/test_local_inference*.py
      - tests/local_inference_fake.py
      - tests/test_optional_inference_disabled.py
      - tests/test_onnx_embedding.py
      - tests/test_embedder.py
      - tests/test_embedding_prompts.py
      - tests/test_daemon_runtime_override.py
      - tests/test_daemon_autoupdate.py
      - tests/test_daemon_update.py
      - tests/test_daemon_update_dependencies.py
      - tests/test_version.py
      - tests/conftest.py
      - requirements.txt
      - pyproject.toml
      - .github/workflows/shared-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LANGFUSE_TRACING_ENABLED: "false"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Dense ONNX catalog, inference contracts and index fingerprints
        run: python -B -m pytest tests/test_onnx_embedding.py tests/test_embedder.py tests/test_embedding_prompts.py -q -p no:cacheprovider
      - name: Persistent artifacts and scoped worker contracts
        run: python -B -m pytest tests/test_artifact_store.py tests/test_artifact_service.py tests/test_artifact_mcp.py tests/test_subagent_artifacts.py tests/test_optional_inference_disabled.py -q -p no:cacheprovider
      - name: MCP proxy, host inventory and private-library sync
        run: >-
          python -B -m pytest tests/test_mcp_registry.py tests/test_mcp_hosts.py
          tests/test_mcp_secrets.py tests/test_mcp_upstreams.py tests/test_mcp_stdio.py tests/test_mcp_exposure.py
          tests/test_mcp_cli.py tests/test_mcp_sync.py tests/test_mcp_ui.py
          tests/test_user_sync_blocked.py tests/test_sync_ui_blocked.py
          tests/test_daemon.py tests/test_history_ui.py
          tests/test_daemon_update.py tests/test_daemon_update_dependencies.py tests/test_version.py
          -q -p no:cacheprovider
      - name: Cooperation notifications, request states and MCP privacy
        run: python -B -m pytest tests/test_cooperation_mailbox.py tests/test_cooperation_requests.py tests/test_cooperation_notifications.py tests/test_cooperation_service.py tests/test_cooperation_models.py tests/test_cooperation_mcp.py tests/test_cooperation_runtime_integration.py tests/test_cooperation_instructions.py tests/test_subagent_combined_budget.py -q -p no:cacheprovider
      - name: POSIX fake native and Redis boundaries, runtime identity and update admission
        if: runner.os != 'Windows'
        shell: bash
        run: python -B -m pytest tests/test_local_inference_*.py tests/test_daemon_runtime_override.py tests/test_daemon_autoupdate.py -q -p no:cacheprovider
